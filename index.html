<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ikariam - Página Externa</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
    }

    body {
      background: url('https://raw.githubusercontent.com/Gabs-B/ikariam-aliance/refs/heads/main/descarga.jpeg') 
                  no-repeat center center fixed;
      background-size: contain;
      font-family: 'Georgia', serif;
      color: #f1e6c2;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    .content {
      background-color: rgba(0, 0, 0, 0.4);
      padding: 20px 40px;
      border-radius: 10px;
    }

    h1 {
      font-size: 40px;
      color: gold;
      text-shadow: 2px 2px 5px #000;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 26px;
      color: #fff;
      text-shadow: 2px 2px 4px #000;
      margin: 8px 0;
    }

    hr {
      width: 60%;
      border: 1px solid #c0a060;
      margin: 15px auto;
    }
  </style>
</head>
<body>
  <div class="content">
    <h2>Líder Diplomático: Michellfer</h2>
    <h2>General: Miguel25</h2>
    <h2>Ministerio: Jordy26</h2>
  </div>
</body>
</html>
